<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Liste de taches avec LocalStorage</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="todo">
      <div class="todo__panel">
        <h1 class="todo__title">Liste de Taches</h1>
        <input 
        type="text"
        placeholder=" Introduis une tache ici.."
        id="input"
        class="todo__input" />
        <div class="todo__list"></div>
        <div class="todo__actions">
          <button id="agregar" class="todo__add-button">Ajouter</button>
          <button id="borrar" class="todo__delete-button">Effacer</button>
          <p class="todo__total">total : <span id="total"></span></p>
        </div>
      </div>
    </div>
    <script src="js/listaTareasconLocalStorage.js"></script>
  </body>
</html>
